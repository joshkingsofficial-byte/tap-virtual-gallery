name: Publish site to gh-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site
        run: |
          cat pack/site.tar.b64.part* > site.tar.b64
          echo "262e2650fa6cdaf1a66d14e1d28eda75a5ef6a4daa234ddbdd55a8fc77f33b41  site.tar.b64" | sha256sum -c -
          mkdir _site
          base64 -d site.tar.b64 | tar -x -C _site
          touch _site/.nojekyll
          ls -la _site
      - name: Push to gh-pages
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish site from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Try to enable Pages from gh-pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST repos/${GITHUB_REPOSITORY}/pages -f 'source[branch]=gh-pages' -f 'source[path]=/' || gh api repos/${GITHUB_REPOSITORY}/pages
